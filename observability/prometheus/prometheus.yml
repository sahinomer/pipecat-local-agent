global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: local-agent
    static_configs:
      - targets:
          - host.docker.internal:8001

  - job_name: vllm
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/vllm.json
        refresh_interval: 30s
